name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, Test, Lint & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://wattwise:wattwise_dev@localhost:5432/wattwise?schema=public
      DIRECT_URL: postgresql://wattwise:wattwise_dev@localhost:5432/wattwise?schema=public
      JWT_SECRET: ci-build-placeholder-secret-at-least-32-chars
      WATTWISE_DEMO_MODE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate & generate Prisma client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Run unit tests
        run: npm test

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint

      - name: Production build
        run: npm run build
