services:
  db:
    image: postgres:16-alpine
    container_name: wattwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wattwise
      POSTGRES_PASSWORD: wattwise_dev
      POSTGRES_DB: wattwise
    ports:
      - "5432:5432"
    volumes:
      - wattwise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wattwise -d wattwise"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wattwise_pgdata:
